<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https:; base-uri 'none'; form-action 'none'" />
    <title>New Tab</title>
    <style>
      :root {
        --bg: #eceef4;
        --panel: rgba(255, 255, 255, 0.7);
        --panel-solid: #ffffff;
        --hover: rgba(20, 24, 40, 0.06);
        --line: rgba(20, 24, 40, 0.1);
        --line-strong: rgba(20, 24, 40, 0.2);
        --text: #1b1e29;
        --muted: #667085;
        --accent: #9fa8ff;
        --accent-soft: rgba(159, 168, 255, 0.24);
        --font: "Segoe UI Variable Text", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --r-md: 10px;
        --r-lg: 14px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --panel: rgba(20, 20, 20, 0.75);
          --panel-solid: #141414;
          --hover: rgba(255, 255, 255, 0.08);
          --line: rgba(255, 255, 255, 0.1);
          --line-strong: rgba(255, 255, 255, 0.2);
          --text: #ffffff;
          --muted: #8e8e93;
        }
      }

      [data-theme="dark"], body.dark-mode {
        --bg: #0a0a0a;
        --panel: rgba(20, 20, 20, 0.75);
        --panel-solid: #141414;
        --hover: rgba(255, 255, 255, 0.08);
        --line: rgba(255, 255, 255, 0.1);
        --line-strong: rgba(255, 255, 255, 0.2);
        --text: #ffffff;
        --muted: #8e8e93;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font);
        text-align: center;
        padding: 1.5rem;
        user-select: none;
      }

      .start {
        max-width: 580px;
        width: 100%;
        margin-top: -6vh;
      }

      h1 {
        font-size: 32px;
        font-weight: 650;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      p {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 28px;
      }

      .start-search {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        margin: 0 auto 24px;
        padding: 6px 6px 6px 18px;
        border: 1px solid var(--line-strong);
        border-radius: 99px;
        background: var(--panel-solid);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .start-search:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .start-search input {
        flex: 1;
        min-width: 0;
        padding: 8px 0;
        border: 0;
        outline: 0;
        background: none;
        font: 15px var(--font);
        color: var(--text);
      }

      .start-search button {
        padding: 8px 16px;
        border-radius: 99px;
        font: 14px var(--font);
        font-weight: 500;
        border: 0;
        cursor: pointer;
        transition: opacity 0.15s, background 0.15s;
      }

      .start-search .solid {
        background: var(--text);
        color: var(--bg);
      }

      .start-search .solid:hover {
        opacity: 0.88;
      }

      .start-search .ghost {
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--text);
      }

      .start-search .ghost:hover {
        border-color: var(--accent);
      }

      .quick {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .quick a {
        text-decoration: none;
        padding: 10px 16px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        background: var(--panel-solid);
        color: var(--text);
        font: 13.5px var(--font);
        font-weight: 500;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s, transform 0.1s;
      }

      .quick a:hover {
        border-color: var(--text);
        background: var(--hover);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="start">
      <h1>Where to?</h1>
      <p>Search the web, enter an address, or pick a destination</p>
      <div class="start-search">
        <input id="startSearch" type="text" spellcheck="false" autocomplete="off" placeholder="Search with DuckDuckGo or enter address" aria-label="Search or enter address" autofocus />
        <button class="ghost" id="askBtn">Ask AI</button>
        <button class="solid" id="searchBtn">Search</button>
      </div>
      <div class="quick">
        <a href="https://duckduckgo.com">DuckDuckGo</a>
        <a href="https://news.ycombinator.com">Hacker News</a>
        <a href="https://en.wikipedia.org">Wikipedia</a>
        <a href="https://github.com">GitHub</a>
      </div>
    </div>

    <script>
      (function() {
        try {
          const s = JSON.parse(localStorage.getItem('drift-settings') || '{}');
          if (s.theme) {
            document.documentElement.dataset.theme = s.theme;
          }
        } catch(e) {}

        const input = document.getElementById('startSearch');
        function submit(query) {
          const q = (query || input.value || '').trim();
          if (!q) return;
          if (/^https?:\/\//i.test(q) || /^[\w-]+\.[\w-]+/i.test(q)) {
            window.location.href = /^https?:\/\//i.test(q) ? q : 'https://' + q;
          } else {
            window.location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
          }
        }

        document.getElementById('searchBtn').onclick = () => submit();
        document.getElementById('askBtn').onclick = () => submit(input.value);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') submit();
        });
      })();
    </script>
  </body>
</html>
